name: Gerar Landing Page via Tally

on:
  repository_dispatch:
    types: [tally_novo_imovel]
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install jinja2

      - name: Salvar payload do Tally (se enviado via webhook)
        run: |
          echo '${{ toJson(github.event.client_payload) }}' > dados_tally.json

      - name: Gerar Landing Page
        run: python generate_lp.py

      - name: Enviar alterações geradas de volta ao repositório
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automático: Nova Landing Page gerada pelo GitHub Actions"
          branch: main