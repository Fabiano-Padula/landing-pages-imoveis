name: Gerar Landing Page via Tally

on:
  repository_dispatch:
    types: [tally_novo_imovel]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install jinja2

      - name: Salvar dados do Tally em JSON
        run: |
          echo '${{ toJson(github.event.client_payload) }}' > dados_tally.json

      - name: Executar script de geração
        run: |
          python generate_lp.py dados_tally.json ${{ github.event.client_payload.slug || 'index' }}

      - name: Commit e Push das alterações para a Vercel
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add .
          git commit -m "Nova landing page gerada via Tally" || exit 0
          git push